upstream django_app {
    server web:8000;
}

server {
    listen 80;
    server_name localhost _;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Files
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Media Files
    # Only resort branding is public. Everything else under /media/
    # (payment receipts, clearance statements, ticket attachments, chat
    # attachments, Excel imports) is financial/legal/personal data and must
    # go through an authenticated Django view instead — see
    # PaymentReceiptDownloadView, ClearancePdfDownloadView and
    # TicketAttachmentDownloadView. It used to be served here with no auth
    # at all, and receipt/clearance filenames are sequential integers, so
    # any resort's documents could previously be enumerated by anyone.
    location /media/resort_logos/ {
        alias /app/media/resort_logos/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location /media/ {
        internal;
        alias /app/media/;
    }

    # WebSocket Proxying (/ws/)
    location /ws/ {
        proxy_pass http://django_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Resort-ID $http_x_resort_id;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # HTTP API & Admin Proxying
    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Resort-ID $http_x_resort_id;
    }
}
