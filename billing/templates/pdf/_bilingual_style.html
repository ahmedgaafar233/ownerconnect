<style>
    @page {
        size: A4 portrait;
        margin: 30px 40px;
    }
    * { box-sizing: border-box; }
    body {
        font-family: 'Noto Sans Arabic', 'Noto Kufi Arabic', sans-serif;
        margin: 0;
        padding: 0;
        color: #1a202c;
        line-height: 1.5;
        direction: ltr;
    }

    .header {
        text-align: center;
        margin-bottom: 28px;
        border-bottom: 4px solid #1a202c;
        padding-bottom: 18px;
    }
    .header h1 { margin: 0; font-size: 24px; font-weight: 900; }
    .header p { margin: 6px 0 0; color: #4a5568; font-weight: 700; font-size: 14px; }

    .title-badge, .receipt-no {
        text-align: center;
        margin-bottom: 24px;
    }
    .title-badge span, .receipt-no span {
        display: inline-block;
        background: #1a202c;
        color: white;
        padding: 9px 22px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 900;
        letter-spacing: 0.3px;
    }

    .info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-bottom: 24px;
    }
    .info-box {
        background: #f7fafc;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #edf2f7;
    }
    .info-box h3 { margin: 0 0 6px 0; font-size: 11px; color: #718096; font-weight: 700; }
    .info-box p { margin: 0; font-size: 14px; font-weight: 700; }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 24px;
        font-size: 12px;
    }
    th {
        background: #1a202c;
        color: white;
        text-align: left;
        padding: 10px;
        font-size: 12px;
        font-weight: 700;
    }
    td {
        padding: 10px;
        border-bottom: 1px solid #edf2f7;
        font-size: 12px;
    }

    .status-box {
        padding: 18px 20px;
        border-radius: 14px;
        text-align: center;
        font-size: 15px;
        font-weight: 900;
        margin-bottom: 20px;
    }
    .status-clear { background: #22543d; color: white; }
    .status-outstanding { background: #742a2a; color: white; }

    .totals-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
        margin-bottom: 24px;
    }
    .total-box {
        background: #1a202c;
        color: white;
        padding: 12px;
        border-radius: 10px;
        text-align: center;
    }
    .total-box h4 { margin: 0 0 5px 0; font-size: 11px; opacity: 0.85; font-weight: 700; }
    .total-box p { margin: 0; font-size: 16px; font-weight: 900; }

    .total-box-row {
        background: #1a202c;
        color: white;
        padding: 16px 20px;
        border-radius: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 17px;
        font-weight: 900;
        margin-bottom: 20px;
    }

    .footer {
        margin-top: 30px;
        text-align: center;
        font-size: 10px;
        color: #a0aec0;
        border-top: 1px solid #edf2f7;
        padding-top: 14px;
    }
    .footer p { margin: 3px 0; }
</style>
