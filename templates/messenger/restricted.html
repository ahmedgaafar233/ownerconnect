{% extends 'unfold/layouts/base.html' %}
{% load i18n %}

{% block content %}
<div class="flex items-center justify-center h-[85vh] p-6">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-gray-100 p-12 text-center">
        <div class="w-20 h-20 bg-amber-50 rounded-full flex items-center justify-center text-amber-500 mx-auto mb-6">
            <span class="material-symbols-outlined text-4xl">lock_person</span>
        </div>
        <h3 class="text-xl font-bold text-gray-900">{% trans "Privacy Restriction" %}</h3>
        <p class="text-gray-500 mt-4 leading-relaxed">
            {{ reason }}
        </p>
        <div class="mt-8">
            <a href="{% url 'admin:index' %}" class="inline-flex items-center justify-center px-6 py-2 bg-primary-600 text-white rounded-xl text-sm font-bold hover:bg-primary-700 transition-all">
                <span class="material-symbols-outlined text-sm mr-2">dashboard</span> 
                {% trans "Back to Dashboard" %}
            </a>
        </div>
    </div>
</div>
{% endblock %}
