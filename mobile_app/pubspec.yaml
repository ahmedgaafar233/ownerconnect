name: owner_connect
description: "OwnerConnect - Multi-Tenant Resort Management App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^8.1.3
  dio: ^5.4.0
  equatable: ^2.0.5
  go_router: ^13.0.0
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.0.0
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  firebase_messaging: ^14.7.19
  webview_flutter: ^4.7.0
  intl_phone_field: ^3.2.0
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
