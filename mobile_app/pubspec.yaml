name: owner_connect
description: "OwnerConnect - Multi-Tenant Resort Management App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^8.1.3
  provider: ^6.1.2
  dio: ^5.4.0
  equatable: ^2.0.5
  go_router: ^13.0.0
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.0.0
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  firebase_messaging: ^14.7.19
  webview_flutter: ^4.7.0
  intl_phone_field: ^3.2.0
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10+1
  path_provider: ^2.1.3
  open_filex: ^4.5.0
  flutter_native_splash: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  image_path: "assets/logo/app_icon_1024.png"
  android: true
  ios: true
  adaptive_icon_background: "#F7F2E7"
  adaptive_icon_foreground: "assets/logo/app_icon_foreground.png"
  remove_alpha_ios: true

# Native (OS-level) launch screen — covers the gap between process start and
# Flutter's first frame, which used to be a plain blank white screen for as
# long as Firebase/Google-Sign-In init took in AppDependencies.bootstrap()
# (see main.dart's FlutterNativeSplash.preserve/.remove calls).
flutter_native_splash:
  color: "#F7F2E7"
  image: assets/logo/app_icon_foreground.png
  android_12:
    color: "#F7F2E7"
    image: assets/logo/app_icon_foreground.png

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo/
    - assets/icons/
    - assets/images/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
