services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ownerconnect
      POSTGRES_USER: ownerconnect
      POSTGRES_PASSWORD: ownerconnect
    ports:
      - "5432:5432"
    volumes:
      - oc_db:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - oc_redis:/data

volumes:
  oc_db:
  oc_redis:
